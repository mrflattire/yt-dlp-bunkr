[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-dlp-bunkr"
version = "0.1.0-beta.1"
description = "yt-dlp plugin adding native support for bunkr.* file and album pages"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "yt-dlp>=2024.03.10",
    "curl_cffi>=0.7.0",
]

[tool.ruff.lint.per-file-ignores]
"yt_dlp_plugins/extractor/bunkr.py" = ["ALL"]

[tool.hatch.build.targets.wheel]
packages = ["yt_dlp_plugins"]